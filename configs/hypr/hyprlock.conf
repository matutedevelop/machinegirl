# =====================
#   CONFIGURACIÓN BASE
# =====================


background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 8
}


# Input
input-field {
    font_color = rgba(255,255,255,1.0)
    inner_color = rgba(50,50,50,0.6)
    outline_color = rgba(255,255,255,0.3)
    shadow_color = rgba(0,0,0,0.7)
    rounding = 4
    fade_on_empty = true
}

# Message
label {
    text = Can I help you with your fiction?
    font_size = 18
    font_color = rgba(200,200,200,0.8)
    position = 0, 75
    font_family = VictorMono Nerd Font Propo
}

